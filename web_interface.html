<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonarQube AI Advisor - Web Interface</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #333;
            margin: 0;
            font-size: 2.5em;
        }
        .header p {
            color: #666;
            margin: 10px 0;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .section h3 {
            margin-top: 0;
            color: #333;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            margin: 5px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        .button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .button.secondary {
            background: #e2e8f0;
            color: #4a5568;
        }
        .button.secondary:hover {
            background: #cbd5e0;
        }
        .form-group {
            margin: 15px 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .results {
            margin-top: 20px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .hidden {
            display: none;
        }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
        }
        .status.pending { background: #fef5e7; color: #d69e2e; }
        .status.processing { background: #bee3f8; color: #2c5aa0; }
        .status.completed { background: #c6f6d5; color: #2f855a; }
        .status.failed { background: #fed7d7; color: #e53e3e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 SonarQube AI Advisor</h1>
            <p>Intelligent code analysis with AI-powered recommendations</p>
        </div>

        <!-- Authentication Section -->
        <div id="authSection" class="section">
            <h3>🔐 Login</h3>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <button class="button" onclick="login()">Login</button>
            <button class="button secondary" onclick="showRegister()">Register</button>
        </div>

        <!-- Registration Section -->
        <div id="registerSection" class="section hidden">
            <h3>📝 Register</h3>
            <div class="form-group">
                <label for="regUsername">Username:</label>
                <input type="text" id="regUsername" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="regEmail">Email:</label>
                <input type="email" id="regEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="regPassword">Password:</label>
                <input type="password" id="regPassword" placeholder="Choose a password">
            </div>
            <button class="button" onclick="register()">Register</button>
            <button class="button secondary" onclick="showLogin()">Back to Login</button>
        </div>

        <!-- Analysis Section -->
        <div id="analysisSection" class="section hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>🔍 Start Analysis</h3>
                <button class="button secondary" onclick="logout()">Logout</button>
            </div>
            <div class="form-group">
                <label for="projectKey">SonarQube Project Key:</label>
                <input type="text" id="projectKey" placeholder="e.g., my-java-project">
            </div>
            <button class="button" onclick="startAnalysis()">Start Analysis</button>
            <button class="button secondary" onclick="listProjects()">List Available Projects</button>
            <button class="button secondary" onclick="listMyAnalyses()">My Analyses</button>
        </div>

        <!-- View Report Section -->
        <div id="reportSection" class="section hidden">
            <h3>📊 View Report by ID</h3>
            <div class="form-group">
                <label for="reportId">Report ID:</label>
                <input type="number" id="reportId" placeholder="Enter report ID">
            </div>
            <button class="button" onclick="viewReportById()">View Report</button>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="section hidden">
            <h3>📋 Results</h3>
            <div id="resultContent" class="results"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let authToken = localStorage.getItem('authToken') || '';

        // Page initialization
        window.onload = async function() {
            if (authToken) {
                // Test if the token is still valid
                try {
                    const response = await fetch(`${API_BASE}/api/v1/analysis/requests`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    
                    if (response.ok) {
                        // Token is valid, show authenticated sections
                        showAuthenticatedSections();
                    } else {
                        // Token is invalid, clear it and show login
                        authToken = '';
                        localStorage.removeItem('authToken');
                        showLoginSection();
                    }
                } catch {
                    // Network error, clear token and show login
                    authToken = '';
                    localStorage.removeItem('authToken');
                    showLoginSection();
                }
            } else {
                showLoginSection();
            }
        };

        function showLoginSection() {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('analysisSection').classList.add('hidden');
            document.getElementById('reportSection').classList.add('hidden');
        }

        function showAuthenticatedSections() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('analysisSection').classList.remove('hidden');
            document.getElementById('reportSection').classList.remove('hidden');
        }

        function showRegister() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('registerSection').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
        }

        async function register() {
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                if (response.ok) {
                    alert('Registration successful! Please login.');
                    showLogin();
                } else {
                    const error = await response.json();
                    alert('Registration failed: ' + error.detail);
                }
            } catch (err) {
                alert('Registration failed: ' + err.message);
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });

                if (response.ok) {
                    const data = await response.json();
                    authToken = data.access_token;
                    localStorage.setItem('authToken', authToken);
                    showAuthenticatedSections();
                    showResult('Login successful! You can now analyze projects.');
                } else {
                    const error = await response.json();
                    alert('Login failed: ' + error.detail);
                }
            } catch (err) {
                alert('Login failed: ' + err.message);
            }
        }

        function logout() {
            authToken = '';
            localStorage.removeItem('authToken');
            showLoginSection();
            showResult('Logged out successfully.');
        }

        async function startAnalysis() {
            const projectKey = document.getElementById('projectKey').value;
            if (!projectKey) {
                alert('Please enter a project key');
                return;
            }

            showResult('Starting analysis... Please wait.');

            try {
                const response = await fetch(`${API_BASE}/api/v1/analysis/analyze`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ project_key: projectKey })
                });

                if (response.ok) {
                    const data = await response.json();
                    const startTime = new Date().toLocaleString();
                    showResult(`
                        <div style="background: #e8f5e8; padding: 15px; border-radius: 8px; border-left: 4px solid #28a745;">
                            <h4>✅ Analysis Started Successfully</h4>
                            <p><strong>Project:</strong> ${projectKey}</p>
                            <p><strong>Request ID:</strong> ${data.id}</p>
                            <p><strong>Started at:</strong> ${startTime}</p>
                            <p><strong>Status:</strong> <span class="status pending">PENDING</span></p>
                            <p><em>Monitoring progress... This typically takes 2-5 minutes.</em></p>
                        </div>
                    `);
                    monitorAnalysis(data.id, projectKey, startTime);
                } else if (response.status === 401) {
                    showResult('Authentication expired. Please login again.');
                    logout();
                } else {
                    const error = await response.json();
                    showResult('Analysis failed: ' + (error.detail || 'Unknown error'));
                }
            } catch (err) {
                showResult('Analysis failed: ' + err.message);
            }
        }

        async function monitorAnalysis(requestId, projectKey, startTime) {
            const checkStatus = async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/v1/analysis/status/${requestId}`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        updateStatus(data.status, requestId, projectKey, startTime);
                        
                        if (data.status === 'completed') {
                            showAnalysisResults(requestId, projectKey, startTime);
                        } else if (data.status === 'failed') {
                            const currentTime = new Date().toLocaleString();
                            showResult(`
                                <div style="background: #f8d7da; padding: 15px; border-radius: 8px; border-left: 4px solid #dc3545;">
                                    <h4>❌ Analysis Failed</h4>
                                    <p><strong>Project:</strong> ${projectKey}</p>
                                    <p><strong>Request ID:</strong> ${requestId}</p>
                                    <p><strong>Started at:</strong> ${startTime}</p>
                                    <p><strong>Failed at:</strong> ${currentTime}</p>
                                    <p><strong>Status:</strong> <span class="status failed">FAILED</span></p>
                                    <p>Please check server logs for details.</p>
                                </div>
                            `);
                        } else if (data.status === 'processing' || data.status === 'pending') {
                            setTimeout(checkStatus, 5000); // Check every 5 seconds
                        }
                    } else {
                        showResult(`Failed to monitor analysis. Server returned status: ${response.status}`);
                    }
                } catch (err) {
                    showResult('Cannot connect to server during monitoring. Please check the server.');
                }
            };

            checkStatus();
        }

        function updateStatus(status, requestId, projectKey, startTime) {
            const currentTime = new Date().toLocaleString();
            // Fix duration calculation by using proper date parsing
            const startDate = new Date(startTime.replace(/(\d+)\.(\d+)\.(\d+),/, '$3-$2-$1'));
            const duration = Math.round((new Date() - startDate) / 1000);
            const minutes = Math.floor(duration / 60);
            const seconds = duration % 60;
            const durationText = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;
            
            showResult(`
                <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 4px solid #ffc107;">
                    <h4>⏳ Analysis In Progress</h4>
                    <p><strong>Project:</strong> ${projectKey}</p>
                    <p><strong>Request ID:</strong> ${requestId}</p>
                    <p><strong>Started at:</strong> ${startTime}</p>
                    <p><strong>Current time:</strong> ${currentTime}</p>
                    <p><strong>Duration:</strong> ${durationText}</p>
                    <p><strong>Status:</strong> <span class="status ${status}">${status.toUpperCase()}</span></p>
                    <div style="margin: 10px 0;">
                        <div style="background: #e9ecef; height: 8px; border-radius: 4px; overflow: hidden;">
                            <div style="width: ${status === 'pending' ? '25%' : status === 'processing' ? '75%' : '100%'}; height: 100%; background: #667eea; transition: width 0.3s ease;"></div>
                        </div>
                    </div>
                    <p><em>Please wait... Typical analysis takes 2-5 minutes.</em></p>
                </div>
            `);
        }

        async function showAnalysisResults(requestId, projectKey, startTime) {
            try {
                const completedTime = new Date().toLocaleString();
                // Fix duration calculation by using proper date parsing
                const startDate = new Date(startTime.replace(/(\d+)\.(\d+)\.(\d+),/, '$3-$2-$1'));
                const totalDuration = Math.round((new Date() - startDate) / 1000);
                const minutes = Math.floor(totalDuration / 60);
                const seconds = totalDuration % 60;
                const durationText = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;

                const htmlResponse = await fetch(`${API_BASE}/api/v1/analysis/requests/${requestId}/report/html`, {
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Accept': 'text/html'
                    }
                });

                if (htmlResponse.ok) {
                    const htmlContent = await htmlResponse.text();
                    
                    // Open in new window
                    const newWindow = window.open('', '_blank', 'width=1200,height=800');
                    newWindow.document.write(htmlContent);
                    newWindow.document.close();
                    
                    showResult(`
                        <div style="background: #d4edda; padding: 15px; border-radius: 8px; border-left: 4px solid #28a745;">
                            <h4>✅ Analysis Completed Successfully!</h4>
                            <p><strong>Project:</strong> ${projectKey}</p>
                            <p><strong>Request ID:</strong> ${requestId}</p>
                            <p><strong>Started at:</strong> ${startTime}</p>
                            <p><strong>Completed at:</strong> ${completedTime}</p>
                            <p><strong>Total duration:</strong> ${durationText}</p>
                            <p><strong>Status:</strong> <span class="status completed">COMPLETED</span></p>
                            <div style="margin: 15px 0;">
                                <p><strong>📊 Report Links:</strong></p>
                                <a href="${API_BASE}/api/v1/analysis/requests/${requestId}/report/html" target="_blank" class="button">View HTML Report</a>
                                <a href="${API_BASE}/api/v1/analysis/requests/${requestId}/report/markdown" target="_blank" class="button secondary">Download Markdown</a>
                            </div>
                        </div>
                    `);
                } else {
                    showResult(`❌ Failed to load report: ${htmlResponse.status}`);
                }
            } catch (err) {
                showResult('❌ Failed to load results: ' + err.message);
            }
        }

        async function listProjects() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/analysis/sonarqube/projects`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    const projects = data.projects.map(p => `<li><strong>${p.key}</strong> - ${p.name}</li>`).join('');
                    showResult(`<h4>Available Projects:</h4><ul>${projects}</ul>`);
                } else if (response.status === 401) {
                    showResult('Authentication expired. Please login again.');
                    logout();
                } else {
                    const error = await response.json();
                    showResult('Failed to load projects: ' + error.detail);
                }
            } catch (err) {
                showResult('Failed to load projects: ' + err.message);
            }
        }

        async function listMyAnalyses() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/analysis/requests`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('Analysis data:', data); // Debug: check what fields are available
                    
                    const analyses = data.map(a => {
                        // Fix timezone issue by creating proper local date
                        const createdDate = new Date(a.created_at + 'Z').toLocaleString(); // Add Z for UTC, then convert to local
                        // Try multiple possible completion date fields
                        const completionDate = a.updated_at || a.completed_at || a.finished_at;
                        const completedDate = completionDate ? new Date(completionDate + 'Z').toLocaleString() : null;
                        const statusClass = a.status.toLowerCase();
                        
                        return `
                            <li style="margin: 10px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #667eea;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <strong>📊 ${a.project_key}</strong><br>
                                        <small><strong>ID:</strong> ${a.id} | <strong>Created:</strong> ${createdDate}</small><br>
                                        ${a.status === 'completed' && completedDate ? 
                                            `<small><strong>Completed:</strong> ${completedDate}</small><br>` : 
                                            a.status === 'completed' ? 
                                            `<small><strong>Status:</strong> Completed (completion time not available)</small><br>` :
                                            ''
                                        }
                                        <span class="status ${statusClass}">${a.status.toUpperCase()}</span>
                                    </div>
                                    <div>
                                        ${a.status === 'completed' ? 
                                            `<button class="button" style="font-size: 0.8em; padding: 8px 12px;" onclick="viewReportById(${a.id})">View Report</button>` : 
                                            ''
                                        }
                                    </div>
                                </div>
                            </li>
                        `;
                    }).join('');
                    
                    showResult(`
                        <ul style="list-style: none; padding: 0;">${analyses}</ul>
                    `, true); // Pass true to indicate this is analysis history
                } else {
                    const error = await response.json();
                    showResult('Failed to load analyses: ' + error.detail);
                }
            } catch (err) {
                showResult('Failed to load analyses: ' + err.message);
            }
        }

        async function viewReportById(requestId) {
            if (!requestId) {
                requestId = document.getElementById('reportId').value;
            }
            
            if (!requestId) {
                alert('Please enter a report ID');
                return;
            }

            try {
                const htmlResponse = await fetch(`${API_BASE}/api/v1/analysis/requests/${requestId}/report/html`, {
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Accept': 'text/html'
                    }
                });

                if (htmlResponse.ok) {
                    const htmlContent = await htmlResponse.text();
                    
                    // Open in new window
                    const newWindow = window.open('', '_blank', 'width=1200,height=800');
                    newWindow.document.write(htmlContent);
                    newWindow.document.close();
                    
                    showResult(`
                        <div class="status completed">Report opened in new window!</div>
                        <p>Report ID: ${requestId}</p>
                    `);
                } else {
                    const error = await response.json();
                    showResult('Failed to load HTML report: ' + error.detail);
                }
            } catch (err) {
                showResult('Failed to load report: ' + err.message);
            }
        }

        function showResult(content, isAnalysisHistory = false) {
            document.getElementById('resultContent').innerHTML = content;
            document.getElementById('resultsSection').classList.remove('hidden');
            // Update the results section title based on content type
            const titleEl = document.querySelector('#resultsSection h3');
            if (isAnalysisHistory) {
                titleEl.innerHTML = '📋 My Analysis History';
            } else {
                titleEl.innerHTML = '📋 Results';
            }
        }
    </script>
</body>
</html>
